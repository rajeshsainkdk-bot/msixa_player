name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project with Native Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.msixa

      - name: Configure Android Permissions and Media Service
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              android:sharedUserId="com.msixa.shared">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Storage & Installation Permissions for Auto-Update & Media Scanner -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />

              <application
                  android:label="Msixa Player"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">

                  <!-- MainActivity extending AudioServiceActivity for Media Playback & APK File Sharing -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- AudioService for Background Playback & Notification Controls -->
                  <service 
                      android:name="com.ryanheise.audioservice.AudioService" 
                      android:foregroundServiceType="mediaPlayback" 
                      android:exported="true" 
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>

                  <!-- MediaButtonReceiver for Notification Bar and Headphone Buttons -->
                  <receiver 
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver" 
                      android:exported="true" 
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>

                  <!-- FileProvider for Direct APK Sharing -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="apk_cache" path="." />
              <external-cache-path name="ext_cache" path="." />
              <files-path name="files" path="." />
              <external-path name="ext_files" path="." />
          </paths>
          EOF

          rm -rf android/app/src/main/kotlin/com/msixa/*
          mkdir -p android/app/src/main/kotlin/com/msixa/msixa_player
          cat << 'EOF' > android/app/src/main/kotlin/com/msixa/msixa_player/MainActivity.kt
          package com.msixa.msixa_player

          import android.content.Intent
          import androidx.core.content.FileProvider
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          class MainActivity: AudioServiceActivity() {
              private val CHANNEL = "com.msixa.player/app_share"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "shareApk") {
                          try {
                              val appInfo = applicationContext.applicationInfo
                              val srcApk = File(appInfo.sourceDir)
                              val destApk = File(cacheDir, "MsixaPlayer.apk")
                              FileInputStream(srcApk).use { input ->
                                  FileOutputStream(destApk).use { output ->
                                      input.copyTo(output)
                                  }
                              }

                              val apkUri = FileProvider.getUriForFile(
                                  this,
                                  "${applicationContext.packageName}.fileprovider",
                                  destApk
                              )

                              val intent = Intent(Intent.ACTION_SEND).apply {
                                  type = "application/vnd.android.package-archive"
                                  putExtra(Intent.EXTRA_STREAM, apkUri)
                                  putExtra(Intent.EXTRA_SUBJECT, "Msixa Player APK")
                                  putExtra(Intent.EXTRA_TEXT, "Msixa Player APK")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }

                              startActivity(Intent.createChooser(intent, "Share Msixa Player APK"))
                              result.success(true)
                          } catch (e: Exception) {
                              result.error("SHARE_ERROR", e.localizedMessage, null)
                          }
                      } else if (call.method == "installApk") {
                          try {
                              val filePath = call.argument<String>("filePath") ?: throw IllegalArgumentException("filePath required")
                              val file = File(filePath)
                              val apkUri = FileProvider.getUriForFile(
                                  this,
                                  "${applicationContext.packageName}.fileprovider",
                                  file
                              )
                              val installIntent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(apkUri, "application/vnd.android.package-archive")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(installIntent)
                              result.success(true)
                          } catch (e: Exception) {
                              result.error("INSTALL_ERROR", e.localizedMessage, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Configure Android Gradle Settings and Resolve Duplicate Kotlin Classes
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion = 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true

          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              resolutionStrategy {
                  eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion('1.8.22')
                      }
                  }
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }

          subprojects {
              project.configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build User APK (Release)
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/msixa-player-release.apk

      - name: Deploy Live Update Package to Cloudflare R2
        run: |
          pip install boto3
          python - << 'EOF'
          import boto3, os, json

          s3 = boto3.client(
              's3',
              endpoint_url='https://25622df2e6919b63cf30e7d06532d778.r2.cloudflarestorage.com',
              aws_access_key_id='3857da30609fecfde1e88f56c842f7f1',
              aws_secret_access_key='77ef640b75cc5d1858ef76bb88872d8baeed1c60f581d4ef0280e67a43dd4ddd',
              region_name='auto'
          )

          apk_path = 'build/app/outputs/flutter-apk/msixa-player-release.apk'
          if os.path.exists(apk_path):
              size_mb = round(os.path.getsize(apk_path) / (1024 * 1024), 2)
              print(f"Uploading {apk_path} ({size_mb} MB) to R2 update/msixa_player_latest.apk...")
              s3.upload_file(
                  apk_path,
                  'msixa-music',
                  'update/msixa_player_latest.apk',
                  ExtraArgs={'ContentType': 'application/vnd.android.package-archive'}
              )

              run_num = int(os.environ.get('GITHUB_RUN_NUMBER', 1))
              manifest = {
                  'version_code': run_num,
                  'version_name': f"1.0.{run_num}",
                  'apk_url': 'https://pub-d4f2e58dc2594d0c8dc1f30bbae4344f.r2.dev/update/msixa_player_latest.apk',
                  'file_size_mb': size_mb,
                  'release_notes': 'Auto-Update: Realtime sync and platform enhancements!',
                  'force_update': False
              }
              print(f"Deploying update manifest: {manifest}")
              s3.put_object(
                  Bucket='msixa-music',
                  Key='update/version.json',
                  Body=json.dumps(manifest),
                  ContentType='application/json'
              )
              print("Cloudflare R2 OTA Auto-Update successfully deployed!")
          EOF

      - name: Build Admin Control APK (Release)
        run: |
          # Configure unique Application ID and App Label for Admin so both apps install side-by-side on same device
          sed -i -E 's/applicationId[[:space:]=]+"[^"]+"/applicationId = "com.msixa.admin"/' android/app/build.gradle || true
          sed -i 's/applicationId "com.msixa.msixa_player"/applicationId "com.msixa.admin"/' android/app/build.gradle || true
          sed -i 's/applicationId "com.msixa.player"/applicationId "com.msixa.admin"/' android/app/build.gradle || true
          sed -i 's/android:label="Msixa Player"/android:label="Msixa Player Admin"/' android/app/src/main/AndroidManifest.xml || true
          rm -rf build/app/outputs/flutter-apk/app-release.apk

          flutter build apk --release --target=lib/main_admin.dart --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/msixa-admin-release.apk

      - name: Upload User APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msixa-Player-APK
          path: build/app/outputs/flutter-apk/msixa-player-release.apk

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msixa-Admin-APK
          path: build/app/outputs/flutter-apk/msixa-admin-release.apk
