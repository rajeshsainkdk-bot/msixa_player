name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project with Native Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.msixa

      - name: Configure Android Permissions and Media Service
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- Storage Permissions for Device Local Audio Scanner -->
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:label="Msixa Player"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.msixa.player.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="apk_cache" path="." />
              <external-cache-path name="ext_cache" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/kotlin/com/msixa/player/MainActivity.kt
          package com.msixa.player

          import android.content.Intent
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.msixa.player/app_share"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "shareApk") {
                          try {
                              val appInfo = applicationContext.applicationInfo
                              val srcApk = File(appInfo.sourceDir)
                              val destApk = File(cacheDir, "MsixaPlayer.apk")
                              FileInputStream(srcApk).use { input ->
                                  FileOutputStream(destApk).use { output ->
                                      input.copyTo(output)
                                  }
                              }

                              val apkUri = FileProvider.getUriForFile(
                                  this,
                                  "com.msixa.player.fileprovider",
                                  destApk
                              )

                              val intent = Intent(Intent.ACTION_SEND).apply {
                                  type = "application/vnd.android.package-archive"
                                  putExtra(Intent.EXTRA_STREAM, apkUri)
                                  putExtra(Intent.EXTRA_SUBJECT, "Msixa Player APK")
                                  putExtra(Intent.EXTRA_TEXT, "Download & Install Msixa Player - Enjoy 100% Free Indian Music & Offline Player!")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }

                              startActivity(Intent.createChooser(intent, "Share Msixa Player APK"))
                              result.success(true)
                          } catch (e: Exception) {
                              result.error("SHARE_ERROR", e.localizedMessage, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Configure minSdkVersion 21
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion = 21/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Msixa-Player-APK
          path: build/app/outputs/flutter-apk/app-release.apk
